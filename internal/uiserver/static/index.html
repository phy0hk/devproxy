<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content</head>="width=device-width, initial-scale=1" />
  <title>DevProxy</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header>
    <h1>DevProxy</h1>
    <div id="status" class="connection-status">connecting…</div>
  </header>

  <main>
    <section>
      <h2>Processes</h2>
      <div id="processes" class="process-grid">
        <div class="muted">loading processes…</div>
      </div>
    </section>

    <section>
      <div class="section-header">
        <div>
          <h2>Events</h2>
          <div class="muted">Select a process tab to see only that instance's logs and proxy requests.</div>
        </div>
      </div>

      <nav id="tabs" class="tabs" aria-label="Event filters"></nav>

      <section class="terminal-panel" aria-label="Event terminal">
        <div class="terminal-header">
          <span class="terminal-dot red"></span>
          <span class="terminal-dot yellow"></span>
          <span class="terminal-dot green"></span>
          <span id="terminal-title" class="terminal-title">all events</span>
        </div>
        <div id="events" class="terminal-body"></div>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
